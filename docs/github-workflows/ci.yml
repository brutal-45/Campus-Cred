name: CI

# Verifies the whole app on every push/PR: schema validation, type-check,
# lint, production build, and an end-to-end workflow smoke test against a
# real Postgres database.
#
# (This replaces the old "python script" workflow that only committed a
# timestamp to updates.txt every 5 minutes for 5 hours.)

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_ENV: production
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campuscred?pgbouncer=true
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/campuscred
  JWT_SECRET: ci-only-access-secret-0123456789abcdef
  JWT_REFRESH_SECRET: ci-only-refresh-secret-0123456789abcdef
  CERT_SECRET: ci-only-certificate-secret-0123456789ab
  ADMIN_EMAIL: admin@campuscred.test
  ADMIN_PASSWORD: Admin@1234
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  EMAIL_PROVIDER: console
  SMS_PROVIDER: console
  # Certificate rendering falls back to the built-in SVG renderer in CI.
  PUPPETEER_SKIP_DOWNLOAD: 'true'
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
  CHECKPOINT_DISABLE: '1'

jobs:
  build-and-smoke:
    name: Build & workflow smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: campuscred
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Push schema to test database
        run: npm run db:push

      - name: Seed admin account
        run: npm run db:seed

      - name: Production build
        run: npm run build

      - name: Start server
        run: |
          npm run start -- -p 3000 > /tmp/server.log 2>&1 &
          echo "Waiting for /api/health ..."
          for i in $(seq 1 60); do
            if curl -fs http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Server is up"
              exit 0
            fi
            sleep 2
          done
          echo "Server failed to start. Log:"
          cat /tmp/server.log
          exit 1

      - name: Run end-to-end workflow smoke test
        env:
          BASE_URL: http://localhost:3000
          SERVER_LOG: /tmp/server.log
        run: npm run test:smoke

      - name: Server log (on failure)
        if: failure()
        run: cat /tmp/server.log

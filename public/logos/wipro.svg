<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 50" width="160" height="50">
  <!-- Wipro Logo - Rainbow spectrum dot -->
  <defs>
    <style>
      .wipro-text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 600; font-size: 19px; fill: #4A0080; }
    </style>
    <linearGradient id="wiproGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF0000"/>
      <stop offset="20%" stop-color="#FF8C00"/>
      <stop offset="40%" stop-color="#FFD700"/>
      <stop offset="60%" stop-color="#00C853"/>
      <stop offset="80%" stop-color="#2196F3"/>
      <stop offset="100%" stop-color="#9C27B0"/>
    </linearGradient>
  </defs>
  <!-- Multi-color rainbow dot -->
  <circle cx="13" cy="22" r="9" fill="url(#wiproGrad)"/>
  <!-- Small highlight -->
  <circle cx="15" cy="19" r="2" fill="#fff" opacity="0.3"/>
  <!-- Wipro text -->
  <text x="28" y="28" class="wipro-text">Wipro</text>
</svg>
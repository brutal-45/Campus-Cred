    <style>
      .cred-text { font-family: 'Arial Black', 'Helvetica Neue', Arial, sans-serif; font-weight: 900; font-size: 22px; fill: #1A1A1A; letter-spacing: 3px; }
    </style>
  </defs>
  <!-- Minimal CRED shield/diamond icon -->
  <rect x="4" y="10" width="26" height="26" rx="5" fill="#1A1A1A"/>

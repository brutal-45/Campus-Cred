<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 50" width="160" height="50">
  <!-- TCS Logo - Tata Consultancy Services -->
  <defs>
    <style>
      .tcs-text { font-family: 'Arial Black', 'Helvetica Neue', Arial, sans-serif; font-weight: 900; font-size: 22px; fill: #2B4B8C; }
      .tcs-sub { font-family: Arial, Helvetica, sans-serif; font-weight: 400; font-size: 7px; fill: #5A7ABF; letter-spacing: 1.5px; }
    </style>
  </defs>
  <!-- T diamond mark -->
  <rect x="5" y="8" width="30" height="30" rx="3" fill="#2B4B8C"/>
  <rect x="13" y="14" width="14" height="3.5" rx="1" fill="#fff"/>
  <rect x="17.5" y="14" width="5" height="18" rx="1" fill="#fff"/>
  <!-- TCS text -->
  <text x="42" y="29" class="tcs-text">TCS</text>
  <!-- Subtitle -->
  <text x="42" y="39" class="tcs-sub">TATA CONSULTANCY SERVICES</text>
</svg>